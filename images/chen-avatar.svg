<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="circleClip">
      <circle cx="100" cy="100" r="95"/>
    </clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a6b8a"/>
      <stop offset="60%" stop-color="#2d8fa8"/>
      <stop offset="100%" stop-color="#4db8cc"/>
    </linearGradient>
    <linearGradient id="skin" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#F2C9A0"/>
      <stop offset="100%" stop-color="#E0AB80"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#CDB06E"/>
      <stop offset="100%" stop-color="#A8894A"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E6F7FF"/>
      <stop offset="100%" stop-color="#C4EAFF"/>
    </linearGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="100" cy="100" r="99" fill="#c8956c"/>

  <g clip-path="url(#circleClip)">
    <!-- Background - teal/adventure -->
    <rect width="200" height="200" fill="url(#bg)"/>

    <!-- Body/Shirt -->
    <ellipse cx="100" cy="218" rx="82" ry="65" fill="url(#shirt)"/>

    <!-- Shirt tropical pattern -->
    <g opacity="0.5">
      <path d="M56 182 Q64 172 72 182 Q64 186 56 182Z" fill="#40B5AD"/>
      <path d="M78 176 Q84 168 90 176 Q84 180 78 176Z" fill="#55C9C0"/>
      <path d="M100 182 Q108 174 114 183 Q107 186 100 182Z" fill="#40B5AD"/>
      <path d="M122 178 Q128 170 134 178 Q128 182 122 178Z" fill="#55C9C0"/>
      <path d="M140 184 Q146 176 150 185 Q144 188 140 184Z" fill="#40B5AD"/>
      <ellipse cx="65" cy="192" rx="6" ry="3.5" fill="#5BC0DE" transform="rotate(-12 65 192)"/>
      <ellipse cx="90" cy="196" rx="5" ry="3" fill="#48C9B0" transform="rotate(18 90 196)"/>
      <ellipse cx="112" cy="190" rx="6" ry="3.5" fill="#5BC0DE" transform="rotate(-8 112 190)"/>
      <ellipse cx="136" cy="195" rx="5" ry="3" fill="#48C9B0" transform="rotate(22 136 195)"/>
      <circle cx="75" cy="188" r="2.5" fill="#48C9B0" opacity="0.7"/>
      <circle cx="105" cy="195" r="2" fill="#40B5AD" opacity="0.6"/>
      <circle cx="128" cy="188" r="2.5" fill="#48C9B0" opacity="0.7"/>
    </g>

    <!-- Collar -->
    <path d="M74 165 L92 177 L100 170 L108 177 L126 165" fill="none" stroke="#D6EDFA" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Buttons -->
    <circle cx="100" cy="180" r="1.8" fill="#888" opacity="0.4"/>
    <circle cx="100" cy="192" r="1.8" fill="#888" opacity="0.3"/>

    <!-- Neck -->
    <path d="M82 147 L82 168 Q84 172 100 174 Q116 172 118 168 L118 147Z" fill="url(#skin)"/>

    <!-- Necklace -->
    <path d="M82 153 Q90 166 100 168 Q110 166 118 153" fill="none" stroke="#1C0F06" stroke-width="2" stroke-linecap="round"/>
    <circle cx="100" cy="168" r="4" fill="#1C0F06"/>
    <circle cx="100" cy="168" r="2.5" fill="#3E2723"/>

    <!-- Head - BROAD, full face -->
    <path d="M48 105 Q46 80 54 65 Q65 48 100 46 Q135 48 146 65 Q154 80 152 105 Q152 130 142 145 Q130 158 100 160 Q70 158 58 145 Q48 130 48 105Z" fill="url(#skin)"/>

    <!-- Ears -->
    <ellipse cx="48" cy="108" rx="8" ry="14" fill="#E0AB80"/>
    <ellipse cx="48" cy="108" rx="4" ry="9" fill="#D6A070" opacity="0.5"/>
    <ellipse cx="152" cy="108" rx="8" ry="14" fill="#E0AB80"/>
    <ellipse cx="152" cy="108" rx="4" ry="9" fill="#D6A070" opacity="0.5"/>

    <!-- Hair - sandy/dirty blonde, M-shaped receding hairline, wavy -->
    <!-- Main hair volume -->
    <path d="M48 98 Q46 62 58 48 Q72 34 100 32 Q128 34 142 48 Q154 62 152 98 Q150 75 142 58 Q130 40 100 37 Q70 40 58 58 Q50 75 48 98Z" fill="url(#hair)"/>
    <!-- M-shaped hairline - receding on sides, peak in middle -->
    <path d="M58 72 Q62 60 72 54 Q80 50 86 52 Q90 56 88 64 Q82 56 72 60 Q64 66 60 74Z" fill="url(#skin)"/>
    <path d="M142 72 Q138 60 128 54 Q120 50 114 52 Q110 56 112 64 Q118 56 128 60 Q136 66 140 74Z" fill="url(#skin)"/>
    <!-- Hair texture/waves -->
    <path d="M55 58 Q65 42 85 36 Q100 34 115 36 Q135 42 145 58" fill="none" stroke="#D4B870" stroke-width="2" opacity="0.5"/>
    <path d="M52 68 Q60 50 78 42 Q92 37 100 36" fill="none" stroke="#C9A860" stroke-width="1.8" opacity="0.4"/>
    <path d="M100 36 Q108 37 122 42 Q140 50 148 68" fill="none" stroke="#C9A860" stroke-width="1.5" opacity="0.35"/>
    <!-- Side hair flowing past ears -->
    <path d="M48 90 Q44 102 42 118 Q41 130 45 138 Q48 130 47 118 Q48 102 50 92Z" fill="url(#hair)"/>
    <path d="M152 90 Q156 102 158 118 Q159 130 155 138 Q152 130 153 118 Q152 102 150 92Z" fill="url(#hair)"/>
    <!-- Hair strand details -->
    <path d="M44 110 Q42 120 43 130" fill="none" stroke="#A8894A" stroke-width="1.2" opacity="0.5"/>
    <path d="M156 110 Q158 120 157 130" fill="none" stroke="#A8894A" stroke-width="1.2" opacity="0.5"/>
    <!-- Highlights -->
    <path d="M68 44 Q82 36 100 34" fill="none" stroke="#E0C880" stroke-width="2.5" opacity="0.4"/>
    <path d="M75 50 Q85 44 95 42" fill="none" stroke="#D8C078" stroke-width="1.5" opacity="0.3"/>

    <!-- Forehead lines (subtle character) -->
    <path d="M72 70 Q100 66 128 70" fill="none" stroke="#D4A476" stroke-width="0.6" opacity="0.3"/>
    <path d="M75 76 Q100 73 125 76" fill="none" stroke="#D4A476" stroke-width="0.6" opacity="0.25"/>

    <!-- Eyebrows - natural, slightly thick -->
    <path d="M66 88 Q76 82 88 85" fill="none" stroke="#8B7030" stroke-width="3" stroke-linecap="round"/>
    <path d="M112 85 Q124 82 134 88" fill="none" stroke="#8B7030" stroke-width="3" stroke-linecap="round"/>

    <!-- Eyes - smaller, squinting from big smile -->
    <ellipse cx="78" cy="97" rx="9" ry="7" fill="white"/>
    <ellipse cx="122" cy="97" rx="9" ry="7" fill="white"/>
    <circle cx="80" cy="97" r="5" fill="#5A7A4A"/>
    <circle cx="124" cy="97" r="5" fill="#5A7A4A"/>
    <circle cx="80" cy="97" r="2.5" fill="#2A1A0A"/>
    <circle cx="124" cy="97" r="2.5" fill="#2A1A0A"/>
    <circle cx="82" cy="95" r="1.8" fill="white" opacity="0.85"/>
    <circle cx="126" cy="95" r="1.8" fill="white" opacity="0.85"/>
    <!-- Upper eyelids - heavy from squinting/smile -->
    <path d="M68 94 Q78 89 88 94" fill="none" stroke="#C09060" stroke-width="1.5"/>
    <path d="M112 94 Q122 89 132 94" fill="none" stroke="#C09060" stroke-width="1.5"/>
    <!-- Lower squint lines -->
    <path d="M70 100 Q78 104 86 100" fill="none" stroke="#D4A476" stroke-width="0.8" opacity="0.5"/>
    <path d="M114 100 Q122 104 130 100" fill="none" stroke="#D4A476" stroke-width="0.8" opacity="0.5"/>

    <!-- Crow's feet - character from years of smiling -->
    <g opacity="0.35" stroke="#C09060" stroke-width="0.8" fill="none">
      <path d="M58 94 Q56 90 54 88"/>
      <path d="M58 97 Q55 96 53 94"/>
      <path d="M142 94 Q144 90 146 88"/>
      <path d="M142 97 Q145 96 147 94"/>
    </g>

    <!-- Nose - prominent, slightly wide/bulbous -->
    <path d="M96 92 Q97 104 94 114" fill="none" stroke="#C89870" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M104 92 Q103 104 106 114" fill="none" stroke="#C89870" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Nose tip/ball -->
    <ellipse cx="100" cy="115" rx="7" ry="4.5" fill="#E8B88A" opacity="0.5"/>
    <!-- Nostrils -->
    <ellipse cx="94" cy="116" rx="3" ry="2" fill="#C89870" opacity="0.3"/>
    <ellipse cx="106" cy="116" rx="3" ry="2" fill="#C89870" opacity="0.3"/>

    <!-- Nasolabial folds (smile creases) -->
    <path d="M72 108 Q68 120 72 132" fill="none" stroke="#D09060" stroke-width="1.2" opacity="0.4"/>
    <path d="M128 108 Q132 120 128 132" fill="none" stroke="#D09060" stroke-width="1.2" opacity="0.4"/>

    <!-- SMILE - Big, wide, warm, SIGNATURE -->
    <path d="M72 128 Q82 142 100 144 Q118 142 128 128" fill="white" opacity="0.85"/>
    <path d="M72 128 Q82 142 100 144 Q118 142 128 128" fill="none" stroke="#B06040" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Upper lip -->
    <path d="M76 128 Q88 124 100 126 Q112 124 124 128" fill="none" stroke="#C07050" stroke-width="1.5"/>
    <!-- Lower lip -->
    <path d="M78 140 Q90 148 100 148 Q110 148 122 140" fill="none" stroke="#C89870" stroke-width="1" opacity="0.5"/>
    <!-- Teeth line -->
    <line x1="100" y1="128" x2="100" y2="140" stroke="#e0d0c0" stroke-width="0.5" opacity="0.3"/>

    <!-- Chin - strong, slightly cleft -->
    <path d="M92 154 Q100 158 108 154" fill="none" stroke="#D4A476" stroke-width="0.8" opacity="0.35"/>

    <!-- Cheek blush -->
    <circle cx="64" cy="120" r="10" fill="#E8A090" opacity="0.15"/>
    <circle cx="136" cy="120" r="10" fill="#E8A090" opacity="0.15"/>
  </g>

  <!-- Ring -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="#c8956c" stroke-width="3.5"/>
  <circle cx="100" cy="100" r="99" fill="none" stroke="rgba(200,149,108,0.2)" stroke-width="1"/>
</svg>